<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atuel Moreno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           1. TOKENS Y SISTEMA VISUAL (BLANCO PURO Y TINTA NEGRA)
           ========================================================= */
        :root {
            --bg-cream: #FFFFFF;
            --ink-black: #000000;
            --muted-gray: #777777;
            --font-main: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: var(--bg-cream);
            color: var(--ink-black);
            font-family: var(--font-main);
            font-weight: 400;
            letter-spacing: -0.02em;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.modal-open {
            overflow: hidden;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* =========================================================
           2. SELECTOR DE IDIOMA UNIFICADO
           ========================================================= */
        .lang-switcher {
            position: fixed;
            top: 1.25rem;
            left: 1.5rem;
            z-index: 98;
            display: block;
            visibility: visible;
            opacity: 1;
            font-family: var(--font-main);
            font-size: 20.25px;
            line-height: 1.2;
            letter-spacing: -0.015em;
            color: var(--ink-black);
            background: rgba(255, 255, 255, 0.94);
            padding: 0.35rem 0.65rem;
            user-select: none;
        }

        .lang-option {
            background: none;
            border: none;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            letter-spacing: inherit;
            color: inherit;
            cursor: pointer;
            padding: 0;
            text-decoration: none;
        }

        .lang-option:hover,
        .lang-option:focus-visible {
            text-decoration: underline;
            text-underline-offset: 4px;
            outline: none;
        }

        .lang-option.is-active {
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .lang-separator {
            margin: 0 0.08rem;
        }

        /* =========================================================
           3. VISTA 1: PORTADA MINIMALISTA + FONDO EXCLUSIVO
           ========================================================= */
        .cover-view {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 2rem;
            max-width: 1180px;
            margin: 0 auto;
        }

        .cover-view.hidden {
            display: none;
        }

        .cover-bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(1.05) translate(0px, 0px) rotate(0deg);
            transition: transform 0.85s var(--ease-out-expo);
            will-change: transform;
            backface-visibility: hidden;
        }

        .cover-bg-layer svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.14;
            mix-blend-mode: multiply;
            display: block;
        }

        .cover-inner {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .portrait-center-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: -1.5rem;
        }

        .portrait-box {
            width: 810px;
            max-width: 96vw;
            aspect-ratio: 600 / 720;
            position: relative;
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: transform 0.2s var(--ease-out-expo);
        }

        .portrait-box:active {
            transform: scale(0.992);
        }

        .portrait-box:focus-visible {
            outline: 1px dashed var(--ink-black);
            outline-offset: 6px;
        }

        .portrait-box svg,
        .portrait-box img.portrait-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .portrait-box img.portrait-slide {
            object-fit: contain;
            filter: grayscale(100%) contrast(120%);
            mix-blend-mode: multiply;
        }

        .portrait-slide {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .portrait-slide.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .portrait-hint {
            text-align: center;
            color: var(--muted-gray);
            font-size: 13.5px;
            margin-top: 2.2rem;
            position: relative;
            z-index: 3;
            user-select: none;
        }

        .portrait-hint.is-hidden,
        .identity-block.is-hidden {
            display: none;
        }

        .identity-block {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            animation: identityReveal 0.45s var(--ease-out-expo) both;
        }

        @keyframes identityReveal {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .artist-name {
            margin: -2.2rem auto 1.15rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .calligraphy-gif {
            width: 500px;
            max-width: 94vw;
            height: auto;
            display: block;
            mix-blend-mode: multiply;
        }

        .bio-section {
            text-align: justify;
            font-size: 15.5px;
            line-height: 1.58;
        }

        .bio-heading {
            font-size: 16px;
            font-weight: 700;
            display: block;
            margin-bottom: 0.45rem;
        }

        .bio-section a,
        .contact-line a {
            color: var(--ink-black);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
        }

        .bio-section a:hover,
        .contact-line a:hover,
        .bio-section a:focus-visible,
        .contact-line a:focus-visible {
            opacity: 0.6;
            outline: none;
        }

        .contact-line {
            margin-top: 1.15rem;
            font-size: 15.5px;
            position: relative;
            z-index: 2;
        }

        .bio-below-anchor {
            display: inline;
            position: relative;
        }

        .portfolio-cta-wrap {
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .bio-to-portfolio-connector {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: visible;
        }

        .btn-portfolio {
            background: none;
            border: none;
            color: var(--ink-black);
            font-family: var(--font-main);
            font-size: 34px;
            font-weight: 400;
            letter-spacing: -0.03em;
            line-height: 1;
            text-transform: lowercase;
            padding: 0.5rem 1rem;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .btn-portfolio:hover,
        .btn-portfolio:focus-visible {
            opacity: 0.7;
            text-decoration: underline;
            text-decoration-thickness: 1.5px;
            text-underline-offset: 6px;
            outline: none;
        }

        /* =========================================================
           4. VISTA 2: ARCHIVO ABIERTO (PORTFOLIO)
           ========================================================= */
        .portfolio-view {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 2.5rem 6rem 2.5rem;
        }

        .portfolio-view.active {
            display: block;
        }

        @media (hover: hover) and (pointer: fine) {
            .portfolio-view.active.is-near-piece,
            .portfolio-view.active.is-near-piece .archive-piece,
            .portfolio-view.active.is-near-piece .piece-visual,
            .portfolio-view.active.is-near-piece .piece-caption {
                cursor: none;
            }
        }

        .portfolio-cursor-bar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 95;
            background-color: var(--ink-black);
            color: var(--bg-cream);
            font-family: var(--font-main);
            font-size: 11.5px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.01em;
            padding: 6px 10px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            display: none;
            will-change: transform;
        }

        .portfolio-cursor-bar.is-visible {
            display: block;
            animation: cursorBarBlinkSharp 1.1s steps(1, end) infinite;
        }

        @keyframes cursorBarBlinkSharp {
            0%, 54.99% { visibility: visible; }
            55%, 100% { visibility: hidden; }
        }

        @media (hover: none), (pointer: coarse) {
            .portfolio-cursor-bar {
                display: none !important;
            }
        }

        .portfolio-mobile-banner {
            display: none;
            background-color: var(--ink-black);
            color: var(--bg-cream);
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: -0.01em;
            text-align: center;
            padding: 7px 12px;
            margin: -1.75rem auto 2.25rem auto;
            width: fit-content;
            max-width: 100%;
            user-select: none;
            animation: cursorBarBlinkSharp 1.1s steps(1, end) infinite;
        }

        @media (hover: none), (pointer: coarse), (max-width: 860px) {
            .portfolio-mobile-banner {
                display: block;
            }
        }

        .portfolio-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-height: 2.25rem;
            padding-bottom: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .btn-back {
            background: none;
            border: none;
            font-family: var(--font-main);
            font-size: 16px;
            color: var(--ink-black);
            cursor: pointer;
            padding: 0.25rem 0;
        }

        .btn-back:hover,
        .btn-back:focus-visible {
            text-decoration: underline;
            text-underline-offset: 3px;
            outline: none;
        }

        .archive-scatter-grid {
            column-count: 3;
            column-gap: 2.25rem;
        }

        .archive-piece {
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 2.75rem;
            cursor: pointer;
            display: inline-block;
            width: 100%;
            outline: none;
        }

        .archive-piece:focus-visible .piece-visual {
            outline: 1.5px solid var(--ink-black);
            outline-offset: 4px;
        }

        .piece-visual {
            width: 100%;
            margin-bottom: 0.7rem;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-cream);
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .piece-visual img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%) contrast(165%) url(#halftoneBinaryFine);
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.45s var(--ease-out-expo);
        }

        .piece-visual img.is-loaded {
            opacity: 1;
        }

        .archive-piece:hover .piece-visual img,
        .archive-piece:focus-visible .piece-visual img {
            transform: scale(1.012);
        }

        .piece-caption {
            font-size: 14.5px;
            line-height: 1.4;
        }

        .piece-compact {
            width: 90%;
        }

        .piece-offset {
            width: 94%;
            margin-left: auto;
        }

        /* =========================================================
           5. VISTA 3: VISOR MODAL A COLOR REAL, CARRUSEL Y ZOOM 100%
           ========================================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: var(--bg-cream);
            z-index: 100;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal-overlay.open {
            display: block;
        }

        .modal-close,
        .modal-nav-btn {
            position: fixed;
            background: var(--bg-cream);
            border: 1px solid var(--ink-black);
            color: var(--ink-black);
            font-family: var(--font-main);
            font-weight: 400;
            line-height: 1;
            width: 38px;
            height: 38px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 110;
            user-select: none;
        }

        .modal-close {
            top: 1.25rem;
            right: 1.5rem;
            font-size: 20px;
            display: flex;
        }

        .modal-nav-btn {
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            display: none;
        }

        .modal-nav-btn.visible {
            display: flex;
        }

        .modal-close:hover,
        .modal-nav-btn:hover,
        .modal-close:focus-visible,
        .modal-nav-btn:focus-visible {
            background: var(--ink-black);
            color: var(--bg-cream);
            outline: none;
        }

        .modal-prev {
            left: 1.5rem;
        }

        .modal-next {
            right: 1.5rem;
        }

        .modal-footer-bar {
            position: fixed;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 110;
            max-width: calc(100vw - 3rem);
            pointer-events: none;
        }

        .modal-caption-pill,
        .modal-counter {
            background: var(--bg-cream);
            border: 1px solid var(--ink-black);
            color: var(--ink-black);
            font-size: 13px;
            padding: 0.28rem 0.7rem;
            user-select: none;
            white-space: nowrap;
        }

        .modal-caption-pill {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-counter {
            display: none;
            flex-shrink: 0;
        }

        .modal-counter.visible {
            display: block;
        }

        .modal-body-full {
            width: 100%;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4.5rem 1.5rem 4.25rem 1.5rem;
        }

        .modal-body-full.is-zoomed {
            display: inline-block;
            width: auto;
            min-width: 100%;
            padding: 4.5rem 1rem 4.25rem 1rem;
        }

        .modal-zoom-container {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: zoom-in;
        }

        .modal-body-full.is-zoomed .modal-zoom-container {
            display: inline-block;
            cursor: grab;
        }

        .modal-body-full.is-zoomed .modal-zoom-container:active {
            cursor: grabbing;
        }

        .modal-zoom-container img {
            max-width: calc(100vw - 3rem);
            max-height: calc(100dvh - 8.75rem);
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0;
            transition: opacity 0.22s ease;
        }

        .modal-zoom-container img.is-loaded {
            opacity: 1;
        }

        .modal-body-full.is-zoomed .modal-zoom-container img {
            max-width: none;
            max-height: none;
        }

        /* =========================================================
           6. ACCESIBILIDAD Y RESPONSIVE
           ========================================================= */
        @media (prefers-reduced-motion: reduce) {
            .cover-bg-layer,
            .portrait-box,
            .identity-block,
            .piece-visual img,
            .modal-zoom-container img,
            .portfolio-cursor-bar,
            .portfolio-mobile-banner {
                transition: none !important;
                animation: none !important;
            }
        }

        @media (max-width: 860px) {
            .cover-view {
                padding: 5.5rem 1.25rem 3rem 1.25rem;
            }
            .lang-switcher {
                top: calc(3.35rem + env(safe-area-inset-top, 0px));
                left: 1rem;
                font-size: 18px;
            }
            .portfolio-view {
                padding-top: calc(3.6rem + env(safe-area-inset-top, 0px));
            }
            .portrait-center-wrap {
                margin-bottom: -1rem;
            }
            .portrait-box {
                width: 570px;
            }
            .artist-name {
                margin: -1rem auto 1.15rem auto;
            }
            .btn-portfolio {
                font-size: 24px;
            }
            .archive-scatter-grid {
                column-count: 2;
                column-gap: 1.5rem;
            }
            .archive-piece {
                margin-bottom: 2.25rem;
            }
            .piece-compact,
            .piece-offset {
                width: 100%;
                margin-left: 0;
            }
        }

        @media (max-width: 520px) {
            .archive-scatter-grid {
                column-count: 1;
            }
            .modal-nav-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .modal-prev {
                left: 0.75rem;
            }
            .modal-next {
                right: 0.75rem;
            }
            .modal-close {
                top: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position:absolute;pointer-events:none;" aria-hidden="true">
        <defs>
            <filter id="inkRoughShared" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="3" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="6.5" xChannelSelector="R" yChannelSelector="G"/>
            </filter>

            <filter id="halftoneBinaryFine" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix" result="gray" values="
                    0.34 0.66 0.14 0 -0.06
                    0.34 0.66 0.14 0 -0.06
                    0.34 0.66 0.14 0 -0.06
                    0    0    0    1  0
                "/>
                <feImage href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='9'%3E%3Cdefs%3E%3Cpattern id='p' width='4.5' height='4.5' patternUnits='userSpaceOnUse' patternTransform='rotate(35)'%3E%3Crect width='4.5' height='4.5' fill='%23EBEBEB'/%3E%3Ccircle cx='2.25' cy='2.25' r='2.1' fill='%23C2C2C2'/%3E%3Ccircle cx='2.25' cy='2.25' r='1.65' fill='%23969696'/%3E%3Ccircle cx='2.25' cy='2.25' r='1.2' fill='%236B6B6B'/%3E%3Ccircle cx='2.25' cy='2.25' r='0.75' fill='%233D3D3D'/%3E%3Ccircle cx='2.25' cy='2.25' r='0.35' fill='%23121212'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23p)'/%3E%3C/svg%3E" x="0" y="0" width="9" height="9" result="tile"/>
                <feTile in="tile" result="tiledScreen"/>
                <feComposite in="gray" in2="tiledScreen" operator="arithmetic" k1="0" k2="0.58" k3="0.42" k4="0" result="mixed"/>
                <feComponentTransfer in="mixed">
                    <feFuncR type="discrete" tableValues="0 0 0 0 0 1 1 1 1"/>
                    <feFuncG type="discrete" tableValues="0 0 0 0 0 1 1 1 1"/>
                    <feFuncB type="discrete" tableValues="0 0 0 0 0 1 1 1 1"/>
                </feComponentTransfer>
            </filter>
        </defs>
    </svg>

    <nav class="lang-switcher" id="langSwitcher" aria-label="Selector de idioma">
        <button type="button" class="lang-option is-active" id="langEsBtn" data-lang="es" aria-pressed="true">español</button><span class="lang-separator" id="langSeparator" aria-hidden="true">/</span><button type="button" class="lang-option" id="langEnBtn" data-lang="en" aria-pressed="false">english</button>
    </nav>

    <main class="cover-view" id="coverView">
        <div class="cover-bg-layer" id="coverBgLayer" aria-hidden="true">
            <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="coverHalftoneGrid" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
                        <circle cx="4" cy="4" r="1.4" fill="#000000"/>
                        <circle cx="13" cy="13" r="0.9" fill="#000000"/>
                    </pattern>
                </defs>
                <g filter="url(#inkRoughShared)">
                    <path d="M-40 160 C260 90, 520 260, 840 180 C1120 110, 1310 210, 1500 140" fill="none" stroke="#000000" stroke-width="2.2" stroke-dasharray="18 10 6 12"/>
                    <path d="M-60 720 C240 640, 560 790, 910 700 C1180 630, 1340 740, 1520 680" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="24 12 8 14"/>
                    <path d="M110 80 C90 320, 160 580, 95 840" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="10 14"/>
                    <path d="M1330 60 C1360 310, 1290 590, 1345 850" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="12 14"/>
                    <ellipse cx="210" cy="240" rx="140" ry="95" fill="url(#coverHalftoneGrid)" transform="rotate(-14 210 240)"/>
                    <ellipse cx="1230" cy="650" rx="165" ry="110" fill="url(#coverHalftoneGrid)" transform="rotate(18 1230 650)"/>
                </g>
            </svg>
        </div>

        <div class="cover-inner">
            <h1 class="sr-only">Atuel Moreno</h1>

            <div class="portrait-center-wrap">
                <div class="portrait-box" id="portraitContainer" role="button" tabindex="0" aria-expanded="false" aria-label="Retrato interactivo de Atuel Moreno. Haz clic o presiona Enter para alternar.">
                    <svg class="portrait-slide" id="portraitSlide1" viewBox="0 0 600 720" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <defs>
                            <pattern id="halftoneDots1" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
                                <rect width="14" height="14" fill="#000000"/>
                                <circle cx="3.5" cy="3.5" r="2.1" fill="#FFFFFF"/>
                                <circle cx="10.5" cy="10.5" r="2.1" fill="#FFFFFF"/>
                            </pattern>

                    dom.langEnBtn.textContent = t.enLabel;
                    dom.langEsBtn.classList.toggle('is-active', lang === 'es');
                    dom.langEnBtn.classList.toggle('is-active', lang === 'en');
                    dom.langEsBtn.setAttribute('aria-pressed', String(lang === 'es'));
                    dom.langEnBtn.setAttribute('aria-pressed', String(lang === 'en'));

                    dom.portraitContainer.setAttribute('aria-label', t.portraitAria);
                    dom.clickPortraitSlide.alt = t.portraitPhotoAlt;
                    dom.portraitHint.textContent = t.portraitHint;
                    dom.bioHeading.textContent = t.bioHeading;
                    dom.bioParagraph.innerHTML = t.bioHtml;
                    dom.contactLine.innerHTML = t.contactPrefix + '<a href="mailto:atuelmoreno@gmail.com">atuelmoreno@gmail.com</a>';
                    dom.openPortfolioBtn.textContent = t.openPortfolio;

                    dom.portfolioView.setAttribute('aria-label', t.portfolioViewAria);
                    dom.backToCoverBtn.textContent = t.backBtn;
                    dom.portfolioMobileBanner.textContent = t.mobileBanner;
                    dom.portfolioCursorBar.textContent = t.cursorBar;

                    dom.closeModalBtn.setAttribute('aria-label', t.closeAria);
                    dom.prevSlideBtn.setAttribute('aria-label', t.prevAria);
                    dom.nextSlideBtn.setAttribute('aria-label', t.nextAria);

                    var pieces = dom.portfolioGrid.querySelectorAll('.archive-piece');
                    pieces.forEach(function(piece) {
                        var idx = Number(piece.dataset.workIndex);
                        var work = PORTFOLIO_WORKS[idx];
                        if (!work) return;
                        var capWithCount = getCaption(work, lang, true);
                        var capEl = piece.querySelector('.piece-caption');
                        var imgEl = piece.querySelector('.piece-visual img');
                        piece.setAttribute('aria-label', capWithCount + ' — ' + t.openPieceHint);
                        if (capEl) capEl.textContent = capWithCount;
                        if (imgEl) imgEl.alt = capWithCount;
                    });

                    if (dom.workModal.classList.contains('open') && state.activeWork) {
                        var modalCap = getCaption(state.activeWork, lang, false);
                        dom.modalImg.alt = modalCap;
                        dom.modalCaptionPill.textContent = modalCap;
                    }

                    scheduleConnectorUpdate();
                }

                dom.langEsBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    applyLanguage('es');
                });

                dom.langEnBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    applyLanguage('en');
                });

                /* =========================================================
                   3. NAVEGACIÓN E HISTORIAL SINCRONIZADO
                   ========================================================= */
                function syncHistory(hash, replace) {
                    try {
                        var baseUrl = window.location.href.split('#')[0];
                        var targetUrl = hash ? (baseUrl + hash) : baseUrl;
                        var stateObj = new Object();
                        stateObj.hash = hash;
                        if (replace) {
                            history.replaceState(stateObj, '', targetUrl);
                        } else {
                            history.pushState(stateObj, '', targetUrl);
                        }
                    } catch (e) {}
                }

                function showPortfolio(pushHistory) {
                    state.view = 'portfolio';
                    stopBeatLoop();
                    dom.coverView.classList.add('hidden');
                    dom.portfolioView.classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'auto' });
                    if (pushHistory && window.location.hash !== '#portfolio') {
                        syncHistory('#portfolio', false);
                    }
                }

                function showCover(pushHistory) {
                    state.view = 'cover';
                    hidePortfolioCursor();
                    dom.portfolioView.classList.remove('active', 'is-near-piece');
                    dom.coverView.classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'auto' });
                    startBeatLoop();
                    scheduleConnectorUpdate();
                    if (pushHistory && window.location.hash) {
                        syncHistory('', false);
                    }
                }

                /* =========================================================
                   4. TRAZO DINÁMICO DE LA FLECHA CONECTORA
                   ========================================================= */
                var connectorRafId = null;

                function scheduleConnectorUpdate() {
                    if (connectorRafId !== null) return;
                    connectorRafId = requestAnimationFrame(function() {
                        connectorRafId = null;
                        updateBioConnector();
                    });
                }

                function updateBioConnector() {
                    var anchor = document.getElementById('bioBelowAnchor');
                    var btn = dom.openPortfolioBtn;
                    var svg = dom.bioConnectorSvg;
                    var pathEl = dom.bioConnectorPath;
                    var headEl = dom.bioConnectorHead;

                    if (!anchor || !btn || !svg || !pathEl || !headEl || state.view !== 'cover' || !state.hasStarted) {
                        if (pathEl) pathEl.setAttribute('d', '');
                        if (headEl) headEl.setAttribute('d', '');
                        return;
                    }

                    var parentRect = svg.getBoundingClientRect();
                    var anchorRects = anchor.getClientRects();
                    var lastAnchorRect = anchorRects.length > 0
                        ? anchorRects[anchorRects.length - 1]
                        : anchor.getBoundingClientRect();
                    var btnRect = btn.getBoundingClientRect();

                    if (parentRect.width === 0 || lastAnchorRect.width === 0 || btnRect.width === 0) return;

                    var startX = (lastAnchorRect.right - parentRect.left) + 8;
                    var startY = (lastAnchorRect.top - parentRect.top) + (lastAnchorRect.height * 0.56);

                    var endX = (btnRect.right - parentRect.left) + 10;
                    var endY = (btnRect.top - parentRect.top) + (btnRect.height * 0.52);

                    var maxRight = parentRect.width - 14;
                    var railX = Math.min(maxRight, Math.max(startX + 18, btnRect.right - parentRect.left + 58));

                    var d = 'M ' + startX.toFixed(1) + ' ' + startY.toFixed(1) +
                            ' L ' + railX.toFixed(1) + ' ' + startY.toFixed(1) +
                            ' L ' + railX.toFixed(1) + ' ' + endY.toFixed(1) +
                            ' L ' + endX.toFixed(1) + ' ' + endY.toFixed(1);
                    pathEl.setAttribute('d', d);

                    var tipX = endX - 3;
                    var tipY = endY;
                    var headD = 'M ' + tipX.toFixed(1) + ' ' + tipY.toFixed(1) +
                                ' L ' + (tipX + 11).toFixed(1) + ' ' + (tipY - 7).toFixed(1) +
                                ' L ' + (tipX + 11).toFixed(1) + ' ' + (tipY + 7).toFixed(1) + ' Z';
                    headEl.setAttribute('d', headD);
                }

                window.addEventListener('resize', function() {
                    if (state.view === 'cover' && state.hasStarted) {
                        scheduleConnectorUpdate();
                    }
                }, { passive: true });

                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(function() {
                        if (state.view === 'cover' && state.hasStarted) {
                            scheduleConnectorUpdate();
                        }
                    });
                }

                dom.openPortfolioBtn.addEventListener('click', function() { showPortfolio(true); });
                dom.backToCoverBtn.addEventListener('click', function() { showCover(true); });

                /* =========================================================
                   5. CURSOR BARRA NEGRA EN PORTFOLIO
                   ========================================================= */
                var PIECE_PROXIMITY_PX = 22;
                var pointerX = 0;
                var pointerY = 0;
                var pointerTarget = null;
                var cursorRafId = null;

                function hidePortfolioCursor() {
                    if (!dom.portfolioCursorBar) return;
                    dom.portfolioCursorBar.classList.remove('is-visible');
                    dom.portfolioView.classList.remove('is-near-piece');
                }

                function isPointerNearAnyPiece(x, y, target) {
                    if (target && target.closest('.archive-piece')) return true;
                    var pieces = dom.portfolioGrid.children;
                    for (var i = 0; i < pieces.length; i += 1) {
                        var rect = pieces[i].getBoundingClientRect();
                        if (
                            x >= rect.left - PIECE_PROXIMITY_PX &&
                            x <= rect.right + PIECE_PROXIMITY_PX &&
                            y >= rect.top - PIECE_PROXIMITY_PX &&
                            y <= rect.bottom + PIECE_PROXIMITY_PX
                        ) {
                            return true;
                        }
                    }
                    return false;
                }

                function updatePortfolioCursor() {
                    cursorRafId = null;
                    if (
                        !supportsFinePointer ||
                        state.view !== 'portfolio' ||
                        dom.workModal.classList.contains('open') ||
                        (pointerTarget && (pointerTarget.closest('.portfolio-header') || pointerTarget.closest('.lang-switcher')))
                    ) {
                        hidePortfolioCursor();
                        return;
                    }

                    if (!isPointerNearAnyPiece(pointerX, pointerY, pointerTarget)) {
                        hidePortfolioCursor();
                        return;
                    }

                    dom.portfolioView.classList.add('is-near-piece');

                    var bar = dom.portfolioCursorBar;
                    bar.classList.add('is-visible');

                    var barWidth = bar.offsetWidth || 210;
                    var barHeight = bar.offsetHeight || 24;
                    var margin = 10;

                    var posX = Math.max(margin, Math.min(window.innerWidth - barWidth - margin, pointerX - barWidth / 2));
                    var posY = Math.max(margin, Math.min(window.innerHeight - barHeight - margin, pointerY - barHeight / 2));

                    bar.style.transform = 'translate3d(' + Math.round(posX) + 'px, ' + Math.round(posY) + 'px, 0)';
                }

                if (supportsFinePointer) {
                    document.addEventListener('mousemove', function(e) {
                        if (state.view !== 'portfolio') return;
                        pointerX = e.clientX;
                        pointerY = e.clientY;
                        pointerTarget = e.target;
                        if (cursorRafId === null) {
                            cursorRafId = requestAnimationFrame(updatePortfolioCursor);
                        }
                    }, { passive: true });

                    document.addEventListener('mouseleave', hidePortfolioCursor);
                }

                /* =========================================================
                   6. RENDERIZADO ACCESIBLE DE LA GRILLA (MINIATURAS OPTIMIZADAS)
                   ========================================================= */
                function buildPortfolioGrid() {
                    var fragment = document.createDocumentFragment();

                    PORTFOLIO_WORKS.forEach(function(work, index) {
                        var layout = work[2];
                        var images = work[3];
                        var initialCaption = getCaption(work, state.lang, true, 0);
                        var article = document.createElement('article');
                        article.className = 'archive-piece';
                        if (layout === 'compact') article.classList.add('piece-compact');
                        if (layout === 'offset') article.classList.add('piece-offset');
                        article.dataset.workIndex = String(index);
                        article.setAttribute('role', 'button');
                        article.setAttribute('tabindex', '0');
                        article.setAttribute('aria-label', initialCaption + ' — ' + I18N[state.lang].openPieceHint);

                        var visualDiv = document.createElement('div');
                        visualDiv.className = 'piece-visual';

                        var img = document.createElement('img');
                        img.alt = initialCaption;
                        img.decoding = 'async';
                        if (index > 2) img.loading = 'lazy';

                        var markLoaded = function() { img.classList.add('is-loaded'); };
                        img.addEventListener('load', markLoaded, { once: true });

                        var triedFullFallback = false;
                        img.addEventListener('error', function handleImgError() {
                            if (!triedFullFallback && this.src !== images[0]) {
                                triedFullFallback = true;
                                this.src = images[0];
                                return;
                            }
                            this.removeEventListener('error', handleImgError);
                            var currentCap = getCaption(work, state.lang, true, 0);
                            this.src = 'https://placehold.co/1200x1600/FFFFFF/000000?text=' + encodeURIComponent(currentCap);
                            markLoaded();
                        });

                        img.src = getThumbnailUrl(images[0]);
                        if (img.complete) markLoaded();

                        var captionDiv = document.createElement('div');
                        captionDiv.className = 'piece-caption';
                        captionDiv.textContent = initialCaption;

                        visualDiv.appendChild(img);
                        article.appendChild(visualDiv);
                        article.appendChild(captionDiv);
                        fragment.appendChild(article);
                    });

                    dom.portfolioGrid.appendChild(fragment);
                }

                /* =========================================================
                   7. RETRATO INTERACTIVO + PULSO CONTINUO DEL FONDO
                   ========================================================= */
                var bgMotionFrames = [
                    'scale(1.05) translate(0px, 0px) rotate(0deg)',
                    'scale(1.05) translate(-12px, 7px) rotate(-0.45deg)',
                    'scale(1.05) translate(10px, -8px) rotate(0.4deg)'
                ];

                if (dom.calligraphyGif) {
                    dom.calligraphyGif.addEventListener('error', function() {
                        var fallback = document.createElement('span');
                        fallback.style.fontSize = '28px';
                        fallback.textContent = 'Atuel Moreno';
                        dom.calligraphyGif.replaceWith(fallback);
                    }, { once: true });
                }

                dom.clickPortraitSlide.addEventListener('error', function() {
                    dom.clickPortraitSlide.style.display = 'none';
                }, { once: true });

                function syncBackgroundWithBeat() {
                    if (!dom.coverBgLayer || prefersReducedMotion) return;
                    dom.coverBgLayer.style.transform = bgMotionFrames[state.rotatingIndex];
                }

                function advanceBeat() {
                    var prevIndex = state.rotatingIndex;
                    state.rotatingIndex = (state.rotatingIndex + 1) % dom.rotatingSlides.length;

                    syncBackgroundWithBeat();

                    if (!state.isPortraitPinned) {
                        dom.rotatingSlides[prevIndex].classList.add('is-hidden');
                        dom.rotatingSlides[state.rotatingIndex].classList.remove('is-hidden');
                    }
                }

                function startBeatLoop() {
                    if (state.beatTimerId !== null || state.view !== 'cover' || document.hidden) return;
                    syncBackgroundWithBeat();
                    state.beatTimerId = window.setInterval(advanceBeat, 1100);
                }

                function stopBeatLoop() {
                    if (state.beatTimerId === null) return;
                    clearInterval(state.beatTimerId);
                    state.beatTimerId = null;
                }

                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) {
                        stopBeatLoop();
                    } else if (state.view === 'cover') {
                        startBeatLoop();
                    }
                });

                function togglePortraitState() {
                    if (!state.hasStarted) {
                        state.hasStarted = true;
                        dom.portraitHint.classList.add('is-hidden');
                        dom.identityBlock.classList.remove('is-hidden');
                        dom.portraitContainer.setAttribute('aria-expanded', 'true');
                        scheduleConnectorUpdate();
                        if (!prefersReducedMotion && dom.identityBlock.scrollIntoView) {
                            dom.identityBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }

                    state.isPortraitPinned = !state.isPortraitPinned;

                    if (state.isPortraitPinned) {
                        dom.rotatingSlides.forEach(function(slide) { slide.classList.add('is-hidden'); });
                        dom.clickPortraitSlide.classList.remove('is-hidden');
                    } else {
                        dom.clickPortraitSlide.classList.add('is-hidden');
                        dom.rotatingSlides[state.rotatingIndex].classList.remove('is-hidden');
                    }
                }

                dom.portraitContainer.addEventListener('click', togglePortraitState);
                dom.portraitContainer.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        togglePortraitState();
                    }
                });

                /* =========================================================
                   8. VISOR MODAL, CARRUSEL TÁCTIL Y ZOOM 100%
                   ========================================================= */
                var zoomScales = [null, 1.0];
                var isDragging = false;
                var hasDragged = false;
                var startX = 0;
                var startY = 0;
                var scrollLeft = 0;
                var scrollTop = 0;
                var touchStartX = 0;
                var touchStartY = 0;

                function resetZoom() {
                    state.zoomStep = 0;
                    isDragging = false;
                    hasDragged = false;
                    dom.modalScrollBody.classList.remove('is-zoomed');
                    dom.modalImg.style.width = '';
                    dom.modalImg.style.height = '';
                    dom.zoomContainer.style.cursor = 'zoom-in';
                    dom.workModal.scrollTop = 0;
                    dom.workModal.scrollLeft = 0;
                }

                function applyZoomStage(stage, relX, relY) {
                    if (stage === 0) {
                        resetZoom();
                        return;
                    }

                    var scale = zoomScales[stage];
                    var baseWidth = dom.modalImg.naturalWidth || 2048;
                    dom.modalScrollBody.classList.add('is-zoomed');
                    dom.modalImg.style.width = Math.round(baseWidth * scale) + 'px';
                    dom.modalImg.style.height = 'auto';
                    dom.zoomContainer.style.cursor = 'zoom-out';

                    requestAnimationFrame(function() {
                        var rect = dom.modalImg.getBoundingClientRect();
                        dom.workModal.scrollLeft = Math.max(0, (rect.width * relX) - (window.innerWidth / 2));
                        dom.workModal.scrollTop = Math.max(0, (rect.height * relY) - (window.innerHeight / 2));
                    });
                }

                function preloadAdjacentSlides() {
                    var total = state.gallery.length;
                    if (total <= 1) return;
                    var nextUrl = state.gallery[(state.slideIndex + 1) % total];
                    var prevUrl = state.gallery[(state.slideIndex - 1 + total) % total];
                    [nextUrl, prevUrl].forEach(function(url) {
                        var preloader = new Image();
                        preloader.src = url;
                    });
                }

                function updateModalSlide() {
                    resetZoom();
                    var total = state.gallery.length;
                    if (total > 0) {
                        var targetSrc = state.gallery[state.slideIndex];
                        dom.modalImg.classList.remove('is-loaded');
                        dom.modalImg.onload = function() { dom.modalImg.classList.add('is-loaded'); };
                        dom.modalImg.onerror = function() {
                            dom.modalImg.onerror = null;
                            var fallbackLabel = dom.modalImg.alt || I18N[state.lang].fallbackPiece;
                            dom.modalImg.src = 'https://placehold.co/1200x1600/FFFFFF/000000?text=' + encodeURIComponent(fallbackLabel);
                            dom.modalImg.classList.add('is-loaded');
                        };
                        dom.modalImg.src = targetSrc;
                        if (dom.modalImg.complete) {
                            dom.modalImg.classList.add('is-loaded');
                        }
                        preloadAdjacentSlides();
                    }

                    var hasMultiple = total > 1;
                    dom.prevSlideBtn.classList.toggle('visible', hasMultiple);
                    dom.nextSlideBtn.classList.toggle('visible', hasMultiple);
                    dom.modalCounter.classList.toggle('visible', hasMultiple);
                    dom.modalCounter.textContent = (state.slideIndex + 1) + ' / ' + total;
                }

                function openModal(workIndex, pushHistory) {
                    var work = PORTFOLIO_WORKS[workIndex];
                    if (!work) return;

                    hidePortfolioCursor();
                    state.lastFocusedElement = document.activeElement;
                    state.activeWork = work;
                    state.gallery = work[3];
                    state.slideIndex = 0;

                    var modalCap = getCaption(work, state.lang, false, 0);
                    dom.modalImg.alt = modalCap;
                    dom.modalCaptionPill.textContent = modalCap;

                    updateModalSlide();
                    dom.workModal.classList.add('open');
                    document.body.classList.add('modal-open');
                    dom.closeModalBtn.focus({ preventScroll: true });

                    if (pushHistory) {
                        syncHistory('#work-' + workIndex, false);
                    }
                }

                function closeModal(fromPopState) {
                    if (!dom.workModal.classList.contains('open')) return;
                    resetZoom();
                    state.activeWork = null;
                    dom.workModal.classList.remove('open');
                    document.body.classList.remove('modal-open');

                    if (!fromPopState && window.location.hash.indexOf('#work-') === 0) {
                        syncHistory('#portfolio', false);
                    }

                    if (state.lastFocusedElement && typeof state.lastFocusedElement.focus === 'function') {
                        state.lastFocusedElement.focus({ preventScroll: true });
                    }
                }

                function goToPrevSlide(e) {
                    if (e) e.stopPropagation();
                    if (state.gallery.length <= 1) return;
                    state.slideIndex = (state.slideIndex - 1 + state.gallery.length) % state.gallery.length;
                    updateModalSlide();
                }

                function goToNextSlide(e) {
                    if (e) e.stopPropagation();
                    if (state.gallery.length <= 1) return;
                    state.slideIndex = (state.slideIndex + 1) % state.gallery.length;
                    updateModalSlide();
                }

                dom.portfolioGrid.addEventListener('click', function(e) {
                    var piece = e.target.closest('.archive-piece');
                    if (!piece) return;
                    openModal(Number(piece.dataset.workIndex), true);
                });

                dom.portfolioGrid.addEventListener('keydown', function(e) {
                    if (e.key !== 'Enter' && e.key !== ' ') return;
                    var piece = e.target.closest('.archive-piece');
                    if (!piece) return;
                    e.preventDefault();
                    openModal(Number(piece.dataset.workIndex), true);
                });

                dom.zoomContainer.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (hasDragged) {
                        hasDragged = false;
                        return;
                    }
                    var rect = dom.modalImg.getBoundingClientRect();
                    var relX = rect.width > 0 ? (e.clientX - rect.left) / rect.width : 0.5;
                    var relY = rect.height > 0 ? (e.clientY - rect.top) / rect.height : 0.5;
                    state.zoomStep = (state.zoomStep + 1) % zoomScales.length;
                    applyZoomStage(state.zoomStep, relX, relY);
                });

                dom.workModal.addEventListener('touchstart', function(e) {
                    if (e.touches.length !== 1) return;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                dom.workModal.addEventListener('touchend', function(e) {
                    if (state.zoomStep !== 0 || state.gallery.length <= 1 || e.changedTouches.length !== 1) return;
                    var deltaX = e.changedTouches[0].clientX - touchStartX;
                    var deltaY = e.changedTouches[0].clientY - touchStartY;
                    if (Math.abs(deltaX) > 48 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
                        hasDragged = true;
                        if (deltaX < 0) goToNextSlide();
                        else goToPrevSlide();
                        setTimeout(function() { hasDragged = false; }, 50);
                    }
                }, { passive: true });

                dom.modalScrollBody.addEventListener('click', function(e) {
                    if (e.target === dom.modalScrollBody && state.zoomStep === 0) {
                        closeModal(false);
                    }
                });

                dom.zoomContainer.addEventListener('mousedown', function(e) {
                    if (state.zoomStep === 0) return;
                    isDragging = true;
                    hasDragged = false;
                    startX = e.pageX - dom.workModal.offsetLeft;
                    startY = e.pageY - dom.workModal.offsetTop;
                    scrollLeft = dom.workModal.scrollLeft;
                    scrollTop = dom.workModal.scrollTop;
                    dom.zoomContainer.style.cursor = 'grabbing';
                });

                window.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    var walkX = (e.pageX - dom.workModal.offsetLeft) - startX;
                    var walkY = (e.pageY - dom.workModal.offsetTop) - startY;
                    if (Math.abs(walkX) > 4 || Math.abs(walkY) > 4) hasDragged = true;
                    dom.workModal.scrollLeft = scrollLeft - walkX;
                    dom.workModal.scrollTop = scrollTop - walkY;
                });

                function endDrag() {
                    if (!isDragging) return;
                    isDragging = false;
                    if (state.zoomStep > 0) {
                        dom.zoomContainer.style.cursor = 'zoom-out';
                    }
                    setTimeout(function() { hasDragged = false; }, 0);
                }

                window.addEventListener('mouseup', endDrag);
                window.addEventListener('blur', endDrag);

                dom.prevSlideBtn.addEventListener('click', goToPrevSlide);
                dom.nextSlideBtn.addEventListener('click', goToNextSlide);
                dom.closeModalBtn.addEventListener('click', function() { closeModal(false); });

                document.addEventListener('keydown', function(e) {
                    if (!dom.workModal.classList.contains('open')) return;
                    if (e.key === 'Escape') closeModal(false);
                    else if (e.key === 'ArrowLeft') goToPrevSlide();
                    else if (e.key === 'ArrowRight') goToNextSlide();
                });

                function handleRouteFromHash(pushHistory) {
                    var hash = window.location.hash;
                    if (hash.indexOf('#work-') === 0) {
                        var idx = Number(hash.replace('#work-', ''));
                        if (!isNaN(idx) && PORTFOLIO_WORKS[idx]) {
                            showPortfolio(pushHistory);
                            openModal(idx, pushHistory);
                            return;
                        }
                    }
                    if (dom.workModal.classList.contains('open')) {
                        closeModal(true);
                    }
                    if (hash === '#portfolio') {
                        showPortfolio(pushHistory);
                    } else {
                        showCover(pushHistory);
                    }
                }

                window.addEventListener('popstate', function() { handleRouteFromHash(false); });

                /* =========================================================
                   9. FAVICON DINÁMICO COMPATIBLE CON TUMBLR
                   ========================================================= */
                function setPortraitFavicon() {
                    try {
                        var canvas = document.createElement('canvas');
                        canvas.width = 64;
                        canvas.height = 64;
                        var ctx = canvas.getContext('2d');
                        if (!ctx || typeof Path2D === 'undefined') return;

                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        if (typeof ctx.roundRect === 'function') {
                            ctx.roundRect(0, 0, 64, 64, 10);
                        } else {
                            ctx.rect(0, 0, 64, 64);
                        }
                        ctx.fill();

                        var scale = 64 / 410;
                        ctx.save();
                        ctx.scale(scale, scale);
                        ctx.translate(-90, -50);

                        ctx.fillStyle = '#000000';
